<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>🎵 DoodleTunes - Playback</title>
    <link rel="stylesheet" href="src/ui/style.css">
    <style>
      :root {
        --bg: #f6f9ff;
        --panel: #ffffff;
        --text: #1b1f2a;
        --muted: #6b7280;
        --primary: #4f46e5;
        --primary-600: #4338ca;
        --border: #e5e7eb;
        --chip: #eef2ff;
        --radius: 14px;
        --shadow: 0 8px 30px rgba(0,0,0,0.06);
      }
      * { box-sizing: border-box; }
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        margin: 0;
        color: var(--text);
        background: linear-gradient(180deg, #f7fbff 0%, #ffffff 60%);
      }
      .app {
        max-width: 960px;
        margin: 0 auto;
        padding: 28px 18px 40px;
      }
      .hero {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }
      h1 {
        margin: 0;
        font-size: 26px;
        background: linear-gradient(90deg, #0f172a, #374151);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        letter-spacing: -0.2px;
      }
      .row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
      label { font-size: 13px; color: #374151; display: inline-block; margin-bottom: 6px; }
      input, select, button { padding: 10px 12px; font-size: 14px; }
      input, select {
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #fff;
        width: 100%;
      }
      .select { position: relative; }
      .select select {
        -webkit-appearance: none;
        -moz-appearance: none;
        appearance: none;
        padding-right: 36px;
        background-color: #fff;
      }
      .select:after {
        content: "";
        position: absolute;
        right: 12px;
        top: 50%;
        width: 0;
        height: 0;
        border-left: 6px solid transparent;
        border-right: 6px solid transparent;
        border-top: 6px solid var(--muted);
        transform: translateY(-25%);
        pointer-events: none;
      }
      button {
        border: 0;
        background: var(--primary);
        color: #fff;
        border-radius: 10px;
        cursor: pointer;
        padding: 10px 14px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        box-shadow: var(--shadow);
      }
      button:hover { background: var(--primary-600); }
      button[disabled] { opacity: 0.7; cursor: not-allowed; }
      .btn-outline {
        background: #fff;
        color: var(--text);
        border: 1px solid var(--border);
        box-shadow: none;
      }
      .btn-outline:hover { background: #f9fafb; }
      .card {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }
      .grid { display: grid; gap: 14px; grid-template-columns: 1fr; }
      .status { font-size: 13px; color: var(--muted); min-height: 18px; }
      textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px;
        font-size: 14px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        line-height: 1.5;
        resize: vertical;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="hero">
        <h1>🎵 DoodleTunes</h1>
        <a href="index.html" class="btn-outline" style="text-decoration: none;">← Back</a>
      </div>

      <!-- Playback Panel -->
      <div class="card grid">
        <div class="row">
          <div style="flex:1; min-width: 200px;">
            <label for="mood-select">Mood</label><br>
            <div class="select">
              <select id="mood-select">
                <option value="Calm">Calm</option>
                <option value="Sad">Sad</option>
                <option value="Romantic">Romantic</option>
                <option value="Happy" selected>Happy</option>
                <option value="Energetic">Energetic</option>
                <option value="Angry">Angry</option>
              </select>
            </div>
          </div>
          <div style="flex:2; min-width: 260px;">
            <label>Volume</label><br>
            <div class="row" style="gap:18px;">
              <label style="flex:1;">
                Voice:
                <input type="range" id="voice-volume" min="0" max="100" value="80" style="width:100%">
                <span id="voice-volume-value">80%</span>
              </label>
              <label style="flex:1;">
                Music:
                <input type="range" id="music-volume" min="0" max="100" value="60" style="width:100%">
                <span id="music-volume-value">60%</span>
              </label>
            </div>
          </div>
          <div style="align-self: end;">
            <button id="play-btn" class="btn-outline">Play</button>
            <button id="stop-btn" class="btn-outline" disabled>Stop</button>
          </div>
        </div>
        <div class="grid">
          <div>
            <label for="lyrics-input">Lyrics</label>
            <textarea id="lyrics-input" rows="8" readonly></textarea>
          </div>
          <div class="status" id="status">Ready</div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/tone@14.7.77/build/Tone.js"></script>
    <script type="module" src="src/playback.js"></script>
  </body>
</html>
