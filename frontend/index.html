<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoodleTunes</title>
    <link rel="stylesheet" href="src/ui/style.css">
</head>
<body>
    <div class="container">
        <h1>🎵 DoodleTunes</h1>
        
        <div class="controls-panel">
            <div class="mood-selector">
                <label for="mood-select">Mood:</label>
                <select id="mood-select">
                    <option value="Calm">Calm</option>
                    <option value="Sad">Sad</option>
                    <option value="Romantic">Romantic</option>
                    <option value="Happy" selected>Happy</option>
                    <option value="Energetic">Energetic</option>
                    <option value="Angry">Angry</option>
                </select>
            </div>
            
            <div class="volume-controls">
                <label>
                    Voice: <input type="range" id="voice-volume" min="0" max="100" value="80">
                    <span id="voice-volume-value">80%</span>
                </label>
                <label>
                    Music: <input type="range" id="music-volume" min="0" max="100" value="60">
                    <span id="music-volume-value">60%</span>
                </label>
            </div>
        </div>
        
        <div class="lyrics-panel">
            <h2>Lyrics</h2>
            <textarea id="lyrics-input" rows="8" readonly>In the quiet morning light
Where dreams take gentle flight
A melody begins to play
Guiding us through the day
With every note that rings
Hope and joy it brings
Together we will sing
A song of everything</textarea>
        </div>
        
        <div class="action-buttons">
            <button id="play-btn">Play</button>
            <button id="stop-btn" disabled>Stop</button>
        </div>
        
        <div class="status" id="status">Ready</div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/tone@14.7.77/build/Tone.js"></script>
    <script type="module" src="src/main.js"></script>
</body>
</html>
