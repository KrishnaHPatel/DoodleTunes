<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DoodleTunes Lyrics</title>
    <style>
      :root {
        --bg: #f6f9ff;
        --panel: #ffffff;
        --text: #1b1f2a;
        --muted: #6b7280;
        --primary: #4f46e5;
        --primary-600: #4338ca;
        --border: #e5e7eb;
        --chip: #eef2ff;
        --radius: 14px;
        --shadow: 0 8px 30px rgba(0,0,0,0.06);
      }
      * { box-sizing: border-box; }
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        margin: 0;
        color: var(--text);
        background: linear-gradient(180deg, #f7fbff 0%, #ffffff 60%);
      }
      .app {
        max-width: 960px;
        margin: 0 auto;
        padding: 28px 18px 40px;
      }
      .hero {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }
      h1 {
        margin: 0;
        font-size: 26px;
        background: linear-gradient(90deg, #0f172a, #374151);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        letter-spacing: -0.2px;
      }
      .subtitle {
        margin: 6px 0 18px;
        color: var(--muted);
        font-size: 14px;
      }
      .row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
      label { font-size: 13px; color: #374151; display: inline-block; margin-bottom: 6px; }
      input, select, button {
        padding: 10px 12px;
        font-size: 14px;
      }
      input, select {
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #fff;
        width: 100%;
      }
      /* Uniform custom select styling */
      .select {
        position: relative;
      }
      .select select {
        -webkit-appearance: none;
        -moz-appearance: none;
        appearance: none;
        padding-right: 36px; /* room for chevron */
        background-color: #fff;
      }
      .select:after {
        content: "";
        position: absolute;
        right: 12px;
        top: 50%;
        width: 0;
        height: 0;
        border-left: 6px solid transparent;
        border-right: 6px solid transparent;
        border-top: 6px solid var(--muted);
        transform: translateY(-25%);
        pointer-events: none;
      }
      button {
        border: 0;
        background: var(--primary);
        color: #fff;
        border-radius: 10px;
        cursor: pointer;
        padding: 10px 14px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        box-shadow: var(--shadow);
      }
      button:hover { background: var(--primary-600); }
      button[disabled] { opacity: 0.7; cursor: not-allowed; }
      .btn-outline {
        background: #fff;
        color: var(--text);
        border: 1px solid var(--border);
        box-shadow: none;
      }
      .btn-outline:hover {
        background: #f9fafb;
      }
      .card {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }
      .grid { display: grid; gap: 14px; grid-template-columns: 1fr; }
      .status { font-size: 13px; color: var(--muted); min-height: 18px; }
      pre {
        white-space: pre-wrap;
        word-wrap: break-word;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        background: #fcfcff;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px;
        line-height: 1.5;
        font-size: 14px;
      }
      .actions { display: flex; gap: 10px; margin-top: 8px; }
      .thumb { font-size: 14px; padding: 8px 12px; border-radius: 10px; }
      .thumb:disabled { opacity: 0.6; }
      .meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
      .chip {
        background: var(--chip);
        border: 1px solid #dfe3ff;
        color: #3730a3;
        font-size: 12px;
        padding: 6px 8px;
        border-radius: 999px;
      }
      .spinner {
        width: 14px; height: 14px;
        border: 2px solid rgba(255,255,255,0.6);
        border-top-color: #fff;
        border-radius: 50%;
        display: none;
        animation: spin 1s linear infinite;
      }
      button.loading .spinner { display: inline-block; }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .fade-in { animation: fade 220ms ease-out; }
      @keyframes fade {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="hero">
        <h1>DoodleTunes Lyric Generator</h1>
      </div>
      <div class="subtitle">Enter labels, choose a mood, and generate singable, short lyrics.</div>

      <div class="card grid">
        <div class="row">
          <div style="flex:2; min-width: 260px;">
            <label>Labels (comma separated)</label><br>
            <input id="labels" placeholder="e.g. cat, moon">
          </div>
          <div style="flex:1; min-width: 180px;">
            <label>Mood</label><br>
            <div class="select">
              <select id="emotion">
                <option value="happy">happy</option>
                <option value="sad">sad</option>
                <option value="calm">calm</option>
                <option value="angry">angry</option>
                <option value="energetic">energetic</option>
                <option value="romantic">romantic</option>
              </select>
            </div>
          </div>
          <div style="align-self: end;">
            <button id="generate">
              <span class="btn-label">Generate</span>
              <span class="spinner" aria-hidden="true"></span>
            </button>
          </div>
        </div>

        <div class="status" id="status"></div>

        <div id="result" class="card" style="display:none;">
          <div class="meta" id="meta"></div>
          <pre id="lyrics"></pre>
          <div class="actions">
            <button id="thumbUp" class="thumb btn-outline" title="Thumbs up">👍 Like</button>
            <button id="thumbDown" class="thumb btn-outline" title="Thumbs down">👎 Regenerate</button>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
  </html>
