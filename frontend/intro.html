<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoodleTunes - Welcome</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #1a2f4a;
        --panel: #ffffff;
        --text: #1b1f2a;
        --muted: #6b7280;
        --primary: #667eea;
        --primary-600: #5568d3;
        --primary-light: #e0e7ff;
        --border: #e5e7eb;
        --radius: 16px;
        --shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        --success: #10b981;
        --success-600: #059669;
      }
      
      * {
        box-sizing: border-box;
      }
      
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        margin: 0;
        color: var(--text);
        background: #1a2f4a;
        background-image: 
          radial-gradient(circle at 20% 50%, rgba(34, 197, 94, 0.15) 0%, transparent 50%),
          radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
          radial-gradient(circle at 40% 20%, rgba(34, 197, 94, 0.1) 0%, transparent 50%),
          radial-gradient(circle at 90% 30%, rgba(59, 130, 246, 0.1) 0%, transparent 50%),
          radial-gradient(circle at 10% 90%, rgba(34, 197, 94, 0.12) 0%, transparent 50%),
          radial-gradient(circle at 60% 60%, rgba(59, 130, 246, 0.12) 0%, transparent 50%);
        min-height: 100vh;
        padding: 20px 0;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      
      body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: 
          repeating-linear-gradient(
            45deg,
            transparent,
            transparent 100px,
            rgba(59, 130, 246, 0.03) 100px,
            rgba(59, 130, 246, 0.03) 102px
          ),
          repeating-linear-gradient(
            -45deg,
            transparent,
            transparent 100px,
            rgba(34, 197, 94, 0.03) 100px,
            rgba(34, 197, 94, 0.03) 102px
          );
        pointer-events: none;
        z-index: 0;
      }
      
      .app {
        max-width: 800px;
        margin: 0 auto;
        padding: 40px 24px;
        position: relative;
        z-index: 1;
        text-align: center;
      }
      
      .hero {
        margin-bottom: 40px;
      }
      
      h1 {
        margin: 0 0 30px 0;
        font-size: 44px;
        font-weight: 700;
        font-family: 'Caveat', cursive;
        color: #ffffff;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        letter-spacing: 1px;
      }
      
      .welcome-text {
        margin: 0 0 40px 0;
        color: rgba(255, 255, 255, 0.95);
        font-size: 18px;
        line-height: 1.6;
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
      }
      
      .btn-get-started {
        background: var(--success);
        color: white;
        border: none;
        border-radius: 12px;
        padding: 16px 48px;
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        text-decoration: none;
        display: inline-block;
      }
      
      .btn-get-started:hover {
        background: var(--success-600);
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
      }
      
      .btn-get-started:active {
        transform: translateY(0);
      }
    </style>
</head>
<body>
    <div class="app">
        <div class="hero">
            <h1>DoodleTunes</h1>
            <p class="welcome-text">
                Welcome! Sketch or upload three images, let AI generate lyrics inspired by your drawings, choose a mood, and hear your personalized tune come to life. Enjoy!
            </p>
            <a href="drawing.html" class="btn-get-started">Get Started</a>
        </div>
    </div>
</body>
</html>
